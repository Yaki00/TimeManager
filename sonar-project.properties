# Projet SonarQube - Time Manager
sonar.projectKey=backenddocker
sonar.projectName=Backend Docker - Time Manager
sonar.projectVersion=1.1

# Sources (répertoires racine du code source)
sonar.sources=back

# Exclusions (fichiers/dossiers à ne pas analyser)
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.vite/**,\
  **/coverage/**,\
  **/prisma/migrations/**,\
  **/*.config.js,\
  **/Dockerfile

# Inclure les tests (pour voir la couverture)
sonar.tests=back/tests
sonar.test.inclusions=**/*.spec.js,**/*.test.js

# Language settings
sonar.javascript.lcov.reportPaths=back/coverage/lcov.info

# Quality Gate personnalisée
# Désactivé temporairement pour ne pas bloquer le build
# sonar.qualitygate.wait=true

# Règles JavaScript spécifiques
sonar.javascript.file.suffixes=.js,.jsx
sonar.javascript.lcov.reportPaths=back/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Host URL (défini par la variable d'environnement dans docker-compose)
# sonar.host.url sera défini via SONAR_HOST_URL

# Métriques de qualité personnalisées
sonar.coverage.exclusions=\
  **/tests/**,\
  **/*.spec.js,\
  **/*.test.js,\
  **/coverage/**,\
  **/node_modules/**

