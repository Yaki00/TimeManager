# Nom du workflow qui apparaîtra dans l'interface GitHub Actions
name: CI

# Définit les événements qui déclenchent l'exécution du workflow
# Le workflow s'exécute sur les push et pull requests vers les branches main et development
on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

# Définit les différents jobs qui s'exécutent en parallèle
jobs:
  # Job 1: Exécution des tests backend avec couverture de code
  backend-tests:
    name: Tests Backend
    # Utilise un runner Ubuntu (machine virtuelle Linux)
    runs-on: ubuntu-latest

    # Configure un service PostgreSQL comme conteneur Docker pour les tests
    # Ce service est disponible uniquement pendant l'exécution de ce job
    services:
      postgres:
        # Image Docker PostgreSQL version 16
        image: postgres:16
        # Variables d'environnement pour configurer la base de données
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        # Options de healthcheck pour s'assurer que PostgreSQL est prêt avant de lancer les tests
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        # Expose le port 5432 de PostgreSQL sur le runner
        ports:
          - 5432:5432

    # Variables d'environnement disponibles pour toutes les étapes de ce job
    env:
      NODE_ENV: test
      # URL de connexion à la base de données PostgreSQL du service
      DATABASE_URL: postgresql://app:app@localhost:5432/app?schema=test

    # Étapes séquentielles exécutées dans ce job
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Configure Node.js version 20 et active le cache npm pour accélérer les installations
      # Le cache utilise package-lock.json pour détecter les changements de dépendances
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: back/package-lock.json

      # Installe les dépendances backend de manière reproductible (npm ci)
      # npm ci installe exactement les versions spécifiées dans package-lock.json
      - name: Install dependencies (Backend)
        working-directory: ./back
        run: npm ci

      # Génère le client Prisma à partir du schéma Prisma
      # Nécessaire pour que le code puisse interagir avec la base de données
      - name: Generate Prisma Client
        working-directory: ./back
        run: npm run prisma:generate

      # Applique le schéma Prisma à la base de données PostgreSQL
      # Crée les tables et la structure de la base de données pour les tests
      - name: Push database schema
        working-directory: ./back
        run: npm run prisma:push
        env:
          DATABASE_URL: postgresql://app:app@localhost:5432/app?schema=test

      # Exécute la suite de tests backend avec génération du rapport de couverture
      # Les tests utilisent Vitest et génèrent un rapport au format lcov
      - name: Run tests with coverage
        working-directory: ./back
        run: npm run test:coverage

      # Upload le rapport de couverture vers Codecov (service externe)
      # Permet de visualiser l'évolution de la couverture de code dans le temps
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./back/coverage/lcov.info
          flags: backend
          name: backend-coverage
          # Ne fait pas échouer le CI si l'upload échoue (optionnel)
          fail_ci_if_error: false

  # Job 2: Vérification de la qualité du code frontend avec ESLint
  frontend-lint:
    name: Lint Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies (Frontend)
        working-directory: ./front
        run: npm ci

      # Exécute ESLint pour détecter les erreurs et problèmes de style dans le code
      # Le build échouera si ESLint trouve des erreurs
      - name: Run ESLint
        working-directory: ./front
        run: npm run lint

  # Job 3: Compilation du frontend pour vérifier qu'il n'y a pas d'erreurs de build
  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies (Frontend)
        working-directory: ./front
        run: npm ci

      # Compile le frontend avec Vite pour vérifier qu'il n'y a pas d'erreurs de compilation
      # Génère les fichiers de production dans le dossier dist/
      - name: Build frontend
        working-directory: ./front
        run: npm run build
