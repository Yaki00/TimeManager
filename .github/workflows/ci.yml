# Nom du workflow dans GitHub Actions
name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

jobs:
  # =========================
  # JOB 1 - BACKEND TESTS
  # =========================
  backend-tests:
    name: Tests Backend (Postgres + Prisma + Vitest Coverage)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://app:app@localhost:5432/app?schema=test

    defaults:
      run:
        working-directory: back

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: back/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for PostgreSQL
        run: |
          echo "Vérification PostgreSQL..."
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U app -d app && echo "Postgres OK" && exit 0
            echo "Postgres pas prêt... ($i/30)"
            sleep 2
          done
          echo "ERREUR: Postgres ne répond pas"
          exit 1
        env:
          PGPASSWORD: app

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Push database schema (Prisma)
        run: npm run prisma:push

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Display coverage summary
        if: always()
        run: |
          echo "Résumé de la couverture :"
          if [ -f ./coverage/lcov.info ]; then
            echo "OK: lcov.info généré"
            head -20 ./coverage/lcov.info || true
          else
            echo "ERREUR: lcov.info introuvable"
            ls -la ./coverage || true
          fi

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./back/coverage/lcov.info
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  # =========================
  # JOB 2 - FRONTEND (LINT + BUILD)
  # =========================
  frontend:
    name: Frontend (Lint + Build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: front

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Frontend (Vite)
        run: npm run build
