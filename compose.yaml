services:
  web:
    build:
      context: ./front
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
      - CHOKIDAR_USEPOLLING=1
      - WATCHPACK_POLLING=true
    volumes:
      - ./front:/app
      - node_modules_front:/app/node_modules
    depends_on:
      - backend
    command: >-
      sh -lc '
        if [ -f package-lock.json ]; then
          npm ci --legacy-peer-deps || (rm -f package-lock.json && npm install --legacy-peer-deps)
        else
          npm install --legacy-peer-deps
        fi &&
        exec npm run dev -- --host 0.0.0.0 --port 5173'
  backend:
    build:
      context: ./back
      target: dev
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./back/.env.docker
    environment:
      - PORT=3000
    volumes:
      - ./back:/app
      - node_modules_back_backend:/app/node_modules
    ports:
      - "3000:3000"
    command: >-
      sh -lc '
        if [ ! -f node_modules/.npmci.sha ] || ! sha256sum -c node_modules/.npmci.sha >/dev/null 2>&1; then
          ([ -f package-lock.json ] && npm ci || npm install) &&
          sha256sum package-lock.json > node_modules/.npmci.sha
        fi &&
        npx prisma db push --schema=prisma/schema.prisma &&
        npx prisma generate --schema=prisma/schema.prisma &&
        exec npm run dev'
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/ping').then(()=>process.exit(0)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app -h localhost || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  prisma-studio:
    build:
      context: ./back
      target: dev
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - ./back/.env.docker
    volumes:
      - ./back:/app
      - node_modules_back_studio:/app/node_modules
    ports:
      - "5555:5555"
    command: >-
      sh -lc '
        if [ ! -f node_modules/.npmci.sha ] || ! sha256sum -c node_modules/.npmci.sha >/dev/null 2>&1; then
          ([ -f package-lock.json ] && npm ci || npm install) &&
          sha256sum package-lock.json > node_modules/.npmci.sha
        fi &&
        npx prisma generate --schema=prisma/schema.prisma &&
        exec npx prisma studio --schema=prisma/schema.prisma --port 5555 --hostname 0.0.0.0'
    # → Prisma Studio: http://localhost:5555

  backend-tests:
    build:
      context: ./back
      target: test
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./back/.env.docker
    environment:
      - NODE_ENV=test
      - DATABASE_URL=postgresql://app:app@db:5432/app?schema=test
    volumes:
      - ./back:/app
      - ./back/coverage:/app/coverage
      - ./back/allure-results:/app/allure-results
      - node_modules_back_tests:/app/node_modules
    command: >-
      sh -lc '
        if [ ! -f node_modules/.npmci.sha ] || ! sha256sum -c node_modules/.npmci.sha >/dev/null 2>&1; then
          ([ -f package-lock.json ] && npm ci || npm install) &&
          sha256sum package-lock.json > node_modules/.npmci.sha
        fi &&
        npx prisma db push --schema=prisma/schema.prisma --skip-generate &&
        mkdir -p allure-results coverage &&
        find allure-results -type f \( -name "*.json" -o -name "*.txt" \) -delete 2>/dev/null || true &&
        npm run test:full'

  sonarqube-db:
    image: postgres:15
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U sonar -d sonarqube -h localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  sonarqube:
    image: sonarqube:community
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      SONAR_WEB_JAVAOPTS: "-Xms512m -Xmx512m"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/system/status"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:latest
    depends_on:
      sonarqube:
        condition: service_healthy
    working_dir: /workspace
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    volumes:
      - ./:/workspace
    profiles:
      - tools

  allure:
    image: "frankescobar/allure-docker-service:latest"
    user: root
    ports:
      - "5051:5050"
    volumes:
      - ./back/allure-results:/app/allure-results:ro
    environment:
      CHECK_RESULTS_EVERY_SECONDS: 3
      KEEP_HISTORY: 0
    command: >-
      sh -c "
        while [ ! -d /app/allure-results ] || [ -z \"\$(ls -A /app/allure-results 2>/dev/null)\" ]; do
          sleep 5
        done &&
        exec allure serve -h 0.0.0.0 -p 5050 /app/allure-results"
    profiles:
      - tools

volumes:
  pgdata:
  node_modules_front:
  node_modules_back_backend:
  node_modules_back_studio:
  node_modules_back_tests:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
