services:
  web:
    build:
      context: ./front
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
      - CHOKIDAR_USEPOLLING=1
      - CHOKIDAR_INTERVAL=100
      - WATCHPACK_POLLING=true
    volumes:
      - ./front:/app
      - node_modules_front:/app/node_modules
    depends_on:
      - backend
    command: >-
      sh -lc '
        if [ -x node_modules/.bin/vite ]; then
          echo "deps: OK ";
        else
          echo "deps: manquantes → npm ci ";
          npm ci;
        fi;
        exec npm run dev -- --host 0.0.0.0 --port 5173'

  backend:
    build:
      context: ./back
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./back/.env
    environment:
      - PORT=3000
    volumes:
      - ./back:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    command: >-
      sh -lc '[ -x node_modules/.bin/nodemon ] || (npm ci || npm install);
              exec npm run dev'
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/ping').then(()=>process.exit(0)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app -h localhost || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
  node_modules:
  node_modules_front:
