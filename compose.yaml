services:
  web:
    build:
      context: ./front
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
      - CHOKIDAR_USEPOLLING=1
      - CHOKIDAR_INTERVAL=100
      - WATCHPACK_POLLING=true
      - NODE_ENV=development
      - NPM_CONFIG_PRODUCTION=false
      - NPM_CONFIG_AUDIT=false
      - NPM_CONFIG_FUND=false
    volumes:
      - ./front:/app
      - node_modules_front:/app/node_modules
    depends_on:
      - backend
    command: >-
      sh -lc '
        set -e;
        if [ ! -f node_modules/.npmci.sha ] || ! sha256sum -c node_modules/.npmci.sha >/dev/null 2>&1; then
          if [ -f package-lock.json ]; then npm ci; else npm install; fi;
          sha256sum package-lock.json > node_modules/.npmci.sha;
        fi;
        exec npm run dev -- --host 0.0.0.0 --port 5173'
  backend:
    build:
      context: ./back
      target: dev
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./back/.env.docker
    environment:
      - PORT=3000
      - NODE_ENV=development
      - NPM_CONFIG_PRODUCTION=false
      - NPM_CONFIG_AUDIT=false
      - NPM_CONFIG_FUND=false
    volumes:
      - ./back:/app
      - node_modules_back_backend:/app/node_modules
    ports:
      - "3000:3000"
    command: >-
      sh -lc '
        set -e;
        if [ ! -f node_modules/.npmci.sha ] || ! sha256sum -c node_modules/.npmci.sha >/dev/null 2>&1; then
          if [ -f package-lock.json ]; then npm ci; else npm install; fi;
          sha256sum package-lock.json > node_modules/.npmci.sha;
        fi;
        npx prisma db push --schema=prisma/schema.prisma;
        npx prisma generate --schema=prisma/schema.prisma;
        exec npm run dev'
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/ping').then(()=>process.exit(0)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app -h localhost || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  prisma-studio:
    build:
      context: ./back
      target: dev
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - ./back/.env.docker
    environment:
      - NODE_ENV=development
      - NPM_CONFIG_PRODUCTION=false
      - NPM_CONFIG_AUDIT=false
      - NPM_CONFIG_FUND=false
    volumes:
      - ./back:/app
      - node_modules_back_studio:/app/node_modules
    ports:
      - "5555:5555"
    command: >-
      sh -lc '
        set -e;
        if [ ! -f node_modules/.npmci.sha ] || ! sha256sum -c node_modules/.npmci.sha >/dev/null 2>&1; then
          if [ -f package-lock.json ]; then npm ci; else npm install; fi;
          sha256sum package-lock.json > node_modules/.npmci.sha;
        fi;
        npx prisma generate --schema=prisma/schema.prisma;
        exec npx prisma studio --schema=prisma/schema.prisma --port 5555 --hostname 0.0.0.0'
    # → Prisma Studio: http://localhost:5555

  pgadmin:
    image: dpage/pgadmin4
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    # → PostgreSQL: http://localhost:5050

  backend-tests:
    build:
      context: ./back
      target: test
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./back/.env.docker
    environment:
      - NODE_ENV=test
      - NPM_CONFIG_PRODUCTION=false
      - NPM_CONFIG_AUDIT=false
      - NPM_CONFIG_FUND=false
      - DATABASE_URL=postgresql://app:app@db:5432/app?schema=test
    volumes:
      - ./back:/app
      - node_modules_back_tests:/app/node_modules
    command: >-
      sh -lc '
        set -e;
        if [ ! -f node_modules/.npmci.sha ] || ! sha256sum -c node_modules/.npmci.sha >/dev/null 2>&1; then
          if [ -f package-lock.json ]; then npm ci; else npm install; fi;
          sha256sum package-lock.json > node_modules/.npmci.sha;
        fi;
        npx prisma db push --schema=prisma/schema.prisma --skip-generate;
        npm run test'

volumes:
  pgdata:
  node_modules:
  node_modules_front:
  node_modules_back_backend:
  node_modules_back_studio:
  node_modules_back_tests:
  pgadmin_data:
