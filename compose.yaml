services:
  web:
    build:
      context: ./front
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
      - CHOKIDAR_USEPOLLING=1
      - CHOKIDAR_INTERVAL=100
      - WATCHPACK_POLLING=true
      - NODE_ENV=development
      - NPM_CONFIG_PRODUCTION=false
      - NPM_CONFIG_AUDIT=false
      - NPM_CONFIG_FUND=false
    volumes:
      - ./front:/app
      - node_modules_front:/app/node_modules
    depends_on:
      - backend
    command: >-
      sh -lc '
        set -e;
        if [ ! -f node_modules/.npmci.sha ] || ! sha256sum -c node_modules/.npmci.sha >/dev/null 2>&1; then
          echo "🔍 Vérification des dépendances frontend...";
          if [ -f package-lock.json ]; then 
            echo "📦 Tentative avec npm ci...";
            npm ci || (echo "⚠️ npm ci échoué, régénération..." && rm -f package-lock.json && npm install);
          else 
            echo "📦 Installation avec npm install...";
            npm install;
          fi;
          sha256sum package-lock.json > node_modules/.npmci.sha;
        fi;
        exec npm run dev -- --host 0.0.0.0 --port 5173'
  backend:
    build:
      context: ./back
      target: dev
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./back/.env.docker
    environment:
      - PORT=3000
      - NODE_ENV=development
      - NPM_CONFIG_PRODUCTION=false
      - NPM_CONFIG_AUDIT=false
      - NPM_CONFIG_FUND=false
    volumes:
      - ./back:/app
      - node_modules_back_backend:/app/node_modules
    ports:
      - "3000:3000"
    command: >-
      sh -lc '
        set -e;
        if [ ! -f node_modules/.npmci.sha ] || ! sha256sum -c node_modules/.npmci.sha >/dev/null 2>&1; then
          echo "🔍 Vérification des dépendances...";
          if [ -f package-lock.json ]; then 
            echo "📦 Tentative avec npm ci...";
            npm ci || (echo "⚠️ npm ci échoué, régénération..." && rm -f package-lock.json && npm install);
          else 
            echo "📦 Installation avec npm install...";
            npm install;
          fi;
          sha256sum package-lock.json > node_modules/.npmci.sha;
        fi;
        npx prisma db push --schema=prisma/schema.prisma;
        npx prisma generate --schema=prisma/schema.prisma;
        exec npm run dev'
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/ping').then(()=>process.exit(0)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app -h localhost || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  prisma-studio:
    build:
      context: ./back
      target: dev
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - ./back/.env.docker
    environment:
      - NODE_ENV=development
      - NPM_CONFIG_PRODUCTION=false
      - NPM_CONFIG_AUDIT=false
      - NPM_CONFIG_FUND=false
    volumes:
      - ./back:/app
      - node_modules_back_studio:/app/node_modules
    ports:
      - "5555:5555"
    command: >-
      sh -lc '
        set -e;
        if [ ! -f node_modules/.npmci.sha ] || ! sha256sum -c node_modules/.npmci.sha >/dev/null 2>&1; then
          if [ -f package-lock.json ]; then npm ci; else npm install; fi;
          sha256sum package-lock.json > node_modules/.npmci.sha;
        fi;
        npx prisma generate --schema=prisma/schema.prisma;
        exec npx prisma studio --schema=prisma/schema.prisma --port 5555 --hostname 0.0.0.0'
    # → Prisma Studio: http://localhost:5555

  pgadmin:
    image: dpage/pgadmin4
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    # → PostgreSQL: http://localhost:5050

  backend-tests:
    build:
      context: ./back
      target: test
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./back/.env.docker
    environment:
      - NODE_ENV=test
      - NPM_CONFIG_PRODUCTION=false
      - NPM_CONFIG_AUDIT=false
      - NPM_CONFIG_FUND=false
      - DATABASE_URL=postgresql://app:app@db:5432/app?schema=test
    volumes:
      - ./back:/app
      - node_modules_back_tests:/app/node_modules
    command: >-
      sh -lc '
        set -e;
        if [ ! -f node_modules/.npmci.sha ] || ! sha256sum -c node_modules/.npmci.sha >/dev/null 2>&1; then
          if [ -f package-lock.json ]; then npm ci; else npm install; fi;
          sha256sum package-lock.json > node_modules/.npmci.sha;
        fi;
        npx prisma db push --schema=prisma/schema.prisma --skip-generate;
        npm run test'

  sonarqube-db:
    image: postgres:15
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U sonar -d sonarqube -h localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  sonarqube:
    image: sonarqube:community
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      #réduire l’empreinte mémoire
      SONAR_WEB_JAVAOPTS: "-Xms512m -Xmx512m"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/system/status"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Lance l'analyse SonarQube en montant ton code (monorepo front/back)
  # Utilisation: docker compose run --rm sonar-scanner
  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:latest
    depends_on:
      sonarqube:
        condition: service_healthy
    working_dir: /workspace
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      # Token à générer dans l'UI SonarQube: http://localhost:9000/admin/security
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    volumes:
      - ./:/workspace
    profiles:
      - tools
    # La configuration est dans sonar-project.properties

volumes:
  pgdata:
  node_modules:
  node_modules_front:
  node_modules_back_backend:
  node_modules_back_studio:
  node_modules_back_tests:
  pgadmin_data:

  sonarqube_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
