openapi: 3.0.3
info:
  title: Time Manager API
  version: "1.0.0"
  description: |
    API complète pour la gestion du temps, des équipes et des congés.

    **Base URL**: `http://localhost:3000`

    ## Authentification
    La plupart des endpoints nécessitent un token JWT dans le header `Authorization: Bearer <token>`.

    ## Rôles
    - **Employer**: Utilisateur standard
    - **Manager**: Gestionnaire d'équipe
    - **Responsable**: Administrateur avec tous les droits

servers:
  - url: http://localhost:3000
    description: Développement local

tags:
  - name: Health
    description: Vérifications basiques du serveur et de la base
  - name: Auth
    description: Authentification & jetons
  - name: Users
    description: Gestion des utilisateurs
  - name: Teams
    description: Gestion des équipes
  - name: Clocking
    description: Gestion des pointages
  - name: Leaves
    description: Gestion des congés/demandes d'absence
  - name: Warnings
    description: Gestion des avertissements
  - name: Notifications
    description: Gestion des notifications

security:
  - bearerAuth: []

paths:
  # ═══════════════════════════════════════════════════════
  #  HEALTH
  # ═══════════════════════════════════════════════════════
  /ping:
    get:
      tags: [Health]
      summary: Ping du serveur
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pong:
                    type: boolean
                example: { pong: true }

  /db:
    get:
      tags: [Health]
      summary: Vérifie l'accès à la base PostgreSQL
      description: Retourne l'heure côté base (`SELECT NOW()`).
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  db_time:
                    type: string
                    format: date-time
                example:
                  db_time: "2025-10-17T13:12:00.123Z"

  # ═══════════════════════════════════════════════════════
  #  AUTH
  # ═══════════════════════════════════════════════════════
  /auth/register:
    post:
      tags: [Auth]
      summary: Créer un nouvel utilisateur
      description: |
        Permet de créer un nouveau compte utilisateur dans le système.

        **Validation du mot de passe**: Le mot de passe doit contenir au moins 8 caractères.

        **Rôle par défaut**: Tout nouvel utilisateur est créé avec le rôle "Employer".

        **Contrat par défaut**: Le type de contrat par défaut est "H35".

        **Retour**: L'utilisateur reçoit ses informations ainsi que les tokens d'accès et de rafraîchissement.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            examples:
              normalUser:
                summary: Utilisateur standard
                value:
                  email: "john.doe@example.com"
                  password: "SecurePass123!"
                  firstName: "John"
                  lastName: "Doe"
                  phoneNumber: "0123456789"
              completeUser:
                summary: Utilisateur avec toutes les informations
                value:
                  email: "jane.smith@company.com"
                  password: "MyP@ssw0rd!"
                  firstName: "Jane"
                  lastName: "Smith"
                  phoneNumber: "+33612345678"
      responses:
        "201":
          description: Utilisateur créé avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              examples:
                success:
                  summary: Réponse de succès
                  value:
                    user:
                      id: 1
                      email: "john.doe@example.com"
                      role: "Employer"
                      lastName: "Doe"
                      firstName: "John"
                      phoneNumber: "0123456789"
                      contractType: "H35"
                      tokens:
                        access: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                        refresh: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email déjà utilisé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                emailExists:
                  summary: Email déjà enregistré
                  value:
                    status: "error"
                    code: "EMAIL_IN_USE"
                    message: "Email déjà utilisé"

  /auth/login:
    post:
      tags: [Auth]
      summary: Se connecter et obtenir les jetons
      description: |
        Permet de s'authentifier dans le système en utilisant un email et un mot de passe.

        **Sécurité**: Pour des raisons de sécurité, cette endpoint ne précise jamais si l'email existe ou non.
        En cas d'échec, un message générique est retourné.

        **Tokens**: 
        - **Access Token**: Valide pendant 2 jours, doit être inclus dans le header `Authorization: Bearer <token>`
        - **Refresh Token**: Valide pendant 7 jours, permet de renouveler le token d'accès

        **Le refresh token** peut être utilisé avec l'endpoint `/auth/refresh` pour obtenir un nouveau token d'accès.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              validCredentials:
                summary: Connexion réussie
                value:
                  email: "john.doe@example.com"
                  password: "Secret123!"
              invalidEmail:
                summary: Email incorrect
                value:
                  email: "wrong@example.com"
                  password: "AnyPassword123!"
              invalidPassword:
                summary: Mot de passe incorrect
                value:
                  email: "john.doe@example.com"
                  password: "WrongPassword!"
      responses:
        "200":
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              examples:
                loginSuccess:
                  summary: Réponse de connexion réussie
                  value:
                    user:
                      id: 1
                      email: "john.doe@example.com"
                      role: "Employer"
                      lastName: "Doe"
                      firstName: "John"
                      phoneNumber: "0123456789"
                      contractType: "H35"
                      tokens:
                        access: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                        refresh: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rafraîchir le jeton d'accès
      description: |
        Permet d'obtenir un nouveau token d'accès en utilisant un refresh token valide.

        **Conditions**:
        - Le refresh token doit être valide et non expiré
        - Le refresh token doit avoir été émis par le même serveur

        **Utilisation**: 
        Lorsque votre token d'accès expire (après 2 jours), utilisez ce endpoint avec votre refresh token 
        pour obtenir un nouveau token d'accès sans avoir à vous reconnecter.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh]
              properties:
                refresh:
                  type: string
                  description: Refresh token obtenu lors de la connexion ou de l'inscription
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwidG9rZW5UeXBlIjoicmVmcmVzaCJ9..."
            examples:
              refreshToken:
                summary: Refresh avec token valide
                value:
                  refresh: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwidG9rZW5UeXBlIjoicmVmcmVzaCJ9..."
      responses:
        "200":
          description: Nouveau jeton d'accès
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: string
                    description: Nouveau token d'accès valide pour 2 jours
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwiZW1haWwiOiJqb2huLmRvZUBleGFtcGxlLmNvbSIsInJvbGUiOiJFbXBsb3llciJ9..."
              examples:
                refreshSuccess:
                  summary: Refresh réussi
                  value:
                    access: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwiZW1haWwiOiJqb2huLmRvZUBleGFtcGxlLmNvbSIsInJvbGUiOiJFbXBsb3llciIsImlhdCI6MTY5NzU0NTQwMCwiZXhwIjoxNjk3NzE4MjAwfQ..."
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags: [Auth]
      summary: Profil de l'utilisateur courant (basique)
      description: |
        Récupère les informations de base de l'utilisateur authentifié.

        **Authentification requise**: Un token d'accès valide doit être fourni dans le header.

        **Différence avec `/users/me/info`**: Cette endpoint retourne uniquement les informations de base 
        (id, email, role), tandis que `/users/me/info` retourne toutes les informations de l'utilisateur.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: Identifiant unique de l'utilisateur
                      email:
                        type: string
                        description: Email de l'utilisateur
                      role:
                        $ref: "#/components/schemas/Role"
              examples:
                meResponse:
                  summary: Profil utilisateur
                  value:
                    user:
                      id: 1
                      email: "john.doe@example.com"
                      role: "Employer"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ═══════════════════════════════════════════════════════
  #  USERS
  # ═══════════════════════════════════════════════════════
  /users:
    get:
      tags: [Users]
      summary: Lister tous les utilisateurs (paginé)
      description: |
        Récupère une liste paginée de tous les utilisateurs du système.

        **Filtres automatiques**:
        - Les utilisateurs supprimés (soft delete) sont automatiquement exclus
        - Les utilisateurs sont triés par ID croissant

        **Pagination**:
        - Utilisez les paramètres `skip` et `take` pour la pagination
        - `skip`: Nombre d'éléments à sauter (défaut: 0)
        - `take`: Nombre d'éléments à retourner (défaut: 50, max: 200)

        **Exemple**: Pour obtenir la deuxième page de 25 éléments:
        ```
        GET /users?skip=25&take=25
        ```
      parameters:
        - in: query
          name: skip
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Nombre d'éléments à sauter
          example: 0
        - in: query
          name: take
          schema:
            type: integer
            default: 50
            maximum: 200
            minimum: 1
          description: Nombre d'éléments à retourner (max 200)
          example: 50
      responses:
        "200":
          description: Liste d'utilisateurs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
              examples:
                firstPage:
                  summary: Première page (50 éléments)
                  value:
                    - id: 1
                      email: "john.doe@example.com"
                      firstName: "John"
                      lastName: "Doe"
                      phoneNumber: "0123456789"
                      role: "Employer"
                      contractType: "H35"
                    - id: 2
                      email: "jane.smith@example.com"
                      firstName: "Jane"
                      lastName: "Smith"
                      phoneNumber: "0612345678"
                      role: "Manager"
                      contractType: "H40"
                emptyList:
                  summary: Liste vide
                  value: []
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/info:
    get:
      tags: [Users]
      summary: Obtenir les informations complètes du user courant
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/count:
    get:
      tags: [Users]
      summary: Compter le nombre total d'utilisateurs
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/count/role/{role}:
    get:
      tags: [Users]
      summary: Compter les utilisateurs par rôle
      parameters:
        - $ref: "#/components/parameters/RoleParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/count/contract/{contractType}:
    get:
      tags: [Users]
      summary: Compter les utilisateurs par type de contrat
      parameters:
        - $ref: "#/components/parameters/ContractTypeParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/role/{role}:
    get:
      tags: [Users]
      summary: Lister les utilisateurs par rôle
      parameters:
        - $ref: "#/components/parameters/RoleParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/name/{name}:
    get:
      tags: [Users]
      summary: Rechercher des utilisateurs par nom (prénom ou nom)
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/phone/{phoneNumber}:
    get:
      tags: [Users]
      summary: Rechercher un utilisateur par numéro de téléphone
      parameters:
        - in: path
          name: phoneNumber
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/contract/{contractType}:
    get:
      tags: [Users]
      summary: Lister les utilisateurs par type de contrat
      parameters:
        - $ref: "#/components/parameters/ContractTypeParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/{id}:
    get:
      tags: [Users]
      summary: Obtenir un utilisateur par ID
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Users]
      summary: Mettre à jour un utilisateur
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Users]
      summary: Supprimer un utilisateur (soft delete)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Supprimé
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{id}/role:
    patch:
      tags: [Users]
      summary: Mettre à jour le rôle d'un utilisateur (Responsable uniquement)
      description: Nécessite des privilèges de **Responsable**. Impossible de modifier son propre rôle.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: "#/components/schemas/Role"
      responses:
        "200":
          description: Rôle mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Impossible de modifier son propre rôle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ═══════════════════════════════════════════════════════
  #  TEAMS
  # ═══════════════════════════════════════════════════════
  /teams:
    get:
      tags: [Teams]
      summary: Lister toutes les équipes (paginé)
      parameters:
        - in: query
          name: skip
          schema:
            type: integer
            default: 0
        - in: query
          name: take
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Liste des équipes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Teams]
      summary: Créer une nouvelle équipe (Manager/Responsable)
      description: Seuls les **Manager** et **Responsable** peuvent créer des équipes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamCreate"
      responses:
        "201":
          description: Équipe créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /teams/owner/{ownerId}:
    get:
      tags: [Teams]
      summary: Lister les équipes d'un propriétaire (Manager)
      parameters:
        - in: path
          name: ownerId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Liste des équipes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /teams/{id}:
    get:
      tags: [Teams]
      summary: Obtenir une équipe par ID
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Teams]
      summary: Mettre à jour une équipe (Owner ou Responsable)
      description: Seul le propriétaire (Manager) ou un Responsable peut modifier l'équipe.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamUpdate"
      responses:
        "200":
          description: Équipe mise à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Teams]
      summary: Supprimer une équipe (Owner ou Responsable)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Équipe supprimée
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ═══════════════════════════════════════════════════════
  #  CLOCKING (Pointages)
  # ═══════════════════════════════════════════════════════
  /clockings:
    post:
      tags: [Clocking]
      summary: Créer un pointage
      description: Tous les utilisateurs peuvent créer un pointage. Manager/Responsable peuvent créer pour leur équipe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClockingCreate"
      responses:
        "201":
          description: Pointage créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clocking"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    get:
      tags: [Clocking]
      summary: Lister tous les pointages (paginé, avec filtres)
      description: Responsable uniquement. Filtres disponibles par userId, date, etc.
      parameters:
        - in: query
          name: skip
          schema:
            type: integer
            default: 0
        - in: query
          name: take
          schema:
            type: integer
            default: 50
        - in: query
          name: userId
          schema:
            type: integer
        - in: query
          name: startDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Liste des pointages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Clocking"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /clockings/user/{userId}:
    get:
      tags: [Clocking]
      summary: Lister les pointages d'un utilisateur
      description: Un utilisateur peut voir ses propres pointages. Manager peut voir ceux de son équipe. Responsable peut tout voir.
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
        - in: query
          name: skip
          schema:
            type: integer
            default: 0
        - in: query
          name: take
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Liste des pointages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Clocking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /clockings/user/{userId}/stats:
    get:
      tags: [Clocking]
      summary: Obtenir les statistiques de pointage d'un utilisateur
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Statistiques calculées
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClockingStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /clockings/user/{userId}/date/{date}:
    get:
      tags: [Clocking]
      summary: Lister les pointages d'un utilisateur pour une date spécifique
      parameters:
        - in: path
          name: userId
          required: true
          schema:
