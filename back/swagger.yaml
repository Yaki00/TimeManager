openapi: 3.0.3
info:
  title: API Auth / Users / Teams / Clocking / Leaves
  version: "1.0.0"
  description: |
    Spécification OpenAPI générée à partir de vos routes Express.

    **Base URL**: `http://localhost:3000`

    Cette API gère :
    - **Authentification** : Inscription, connexion, gestion des jetons JWT
    - **Utilisateurs** : CRUD complet avec gestion des rôles et types de contrat
    - **Équipes** : Gestion des équipes avec propriétaires et permissions
    - **Pointages** : Système de pointage avec statistiques et gestion des pauses
    - **Congés** : Demandes d'absence avec workflow d'approbation
servers:
  - url: http://localhost:3000
    description: Développement local

tags:
  - name: Health
    description: Vérifications basiques du serveur et de la base
  - name: Auth
    description: Authentification & jetons
  - name: Users
    description: Gestion des utilisateurs
  - name: Teams
    description: Gestion des équipes
  - name: Clocking
    description: Gestion des pointages
  - name: Leaves
    description: Gestion des congés/demandes d'absence
  - name: Warnings
    description: Gestion des avertissements

security:
  - bearerAuth: []

paths:
  /ping:
    get:
      tags: [Health]
      summary: Ping du serveur
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pong:
                    type: boolean
                example: { pong: true }
  /db:
    get:
      tags: [Health]
      summary: Vérifie l'accès à la base PostgreSQL
      description: Retourne l'heure côté base (`SELECT NOW()`).
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  db_time:
                    type: string
                    format: date-time
                example:
                  db_time: "2025-10-14T13:12:00.123Z"

  /auth/register:
    post:
      tags: [Auth]
      summary: Créer un utilisateur
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Utilisateur créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /auth/login:
    post:
      tags: [Auth]
      summary: Se connecter et obtenir les jetons
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rafraîchir le jeton d'accès
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Nouveau jeton d'accès
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/me:
    get:
      tags: [Auth]
      summary: Profil de l'utilisateur courant
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users:
    get:
      tags: [Users]
      summary: Lister tous les utilisateurs
      responses:
        "200":
          description: Liste d'utilisateurs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/me/info:
    get:
      tags: [Users]
      summary: Obtenir les infos du user courant
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/count:
    get:
      tags: [Users]
      summary: Compter le nombre total d'utilisateurs
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/count/role/{role}:
    get:
      tags: [Users]
      summary: Compter les utilisateurs par rôle
      parameters:
        - $ref: "#/components/parameters/RoleParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/count/contract/{contractType}:
    get:
      tags: [Users]
      summary: Compter les utilisateurs par type de contrat
      parameters:
        - $ref: "#/components/parameters/ContractTypeParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/role/{role}:
    get:
      tags: [Users]
      summary: Lister les utilisateurs par rôle
      parameters:
        - $ref: "#/components/parameters/RoleParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/name/{name}:
    get:
      tags: [Users]
      summary: Rechercher par nom
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/phone/{phoneNumber}:
    get:
      tags: [Users]
      summary: Rechercher par téléphone
      parameters:
        - in: path
          name: phoneNumber
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/contract/{contractType}:
    get:
      tags: [Users]
      summary: Lister par type de contrat
      parameters:
        - $ref: "#/components/parameters/ContractTypeParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/{id}:
    get:
      tags: [Users]
      summary: Obtenir un utilisateur par ID
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Users]
      summary: Mettre à jour un utilisateur (remplacement)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Users]
      summary: Supprimer un utilisateur
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Supprimé
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /users/{id}/role:
    patch:
      tags: [Users]
      summary: Mettre à jour le rôle d'un utilisateur
      description: Nécessite des privilèges de **Responsable**.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: "#/components/schemas/Role"
      responses:
        "200":
          description: Mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams:
    post:
      tags: [Teams]
      summary: Créer une équipe
      description: Nécessite des privilèges de **Responsable** ou **Manager**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamCreate"
      responses:
        "201":
          description: Équipe créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      tags: [Teams]
      summary: Lister toutes les équipes
      responses:
        "200":
          description: Liste des équipes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /teams/owner/{ownerId}:
    get:
      tags: [Teams]
      summary: Lister les équipes d'un propriétaire
      parameters:
        - in: path
          name: ownerId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Liste des équipes du propriétaire
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /teams/{id}:
    get:
      tags: [Teams]
      summary: Obtenir une équipe par ID
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Teams]
      summary: Mettre à jour une équipe
      description: Seuls les propriétaires ou managers de l'équipe peuvent la modifier.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamUpdate"
      responses:
        "200":
          description: Mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Teams]
      summary: Supprimer une équipe
      description: Seuls les propriétaires ou managers de l'équipe peuvent la supprimer.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Supprimé
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /clocking:
    post:
      tags: [Clocking]
      summary: Créer un pointage
      description: Les utilisateurs peuvent créer des pointages pour eux-mêmes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClockingCreate"
      responses:
        "201":
          description: Pointage créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clocking"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags: [Clocking]
      summary: Lister tous les pointages
      description: Réservé aux **Responsable** avec filtres possibles.
      responses:
        "200":
          description: Liste des pointages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Clocking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /clocking/user/{userId}:
    get:
      tags: [Clocking]
      summary: Lister les pointages d'un utilisateur
      description: Les utilisateurs peuvent voir leurs propres pointages, les responsables peuvent voir tous les pointages.
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Liste des pointages de l'utilisateur
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Clocking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /clocking/user/{userId}/stats:
    get:
      tags: [Clocking]
      summary: Obtenir les statistiques de pointage d'un utilisateur
      description: Les utilisateurs peuvent voir leurs propres statistiques, les responsables peuvent voir toutes les statistiques.
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Statistiques de pointage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClockingStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /clocking/user/{userId}/date/{date}:
    get:
      tags: [Clocking]
      summary: Obtenir les pointages d'un utilisateur pour une date
      description: Les utilisateurs peuvent voir leurs propres pointages, les responsables peuvent voir tous les pointages.
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
        - in: path
          name: date
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Pointages de l'utilisateur pour la date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Clocking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /clocking/{id}:
    get:
      tags: [Clocking]
      summary: Obtenir un pointage par ID
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clocking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Clocking]
      summary: Mettre à jour un pointage
      description: Les utilisateurs peuvent modifier leurs propres pointages, les responsables peuvent modifier tous les pointages.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClockingUpdate"
      responses:
        "200":
          description: Mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clocking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Clocking]
      summary: Supprimer un pointage
      description: Les utilisateurs peuvent supprimer leurs propres pointages, les responsables peuvent supprimer tous les pointages.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Supprimé
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

