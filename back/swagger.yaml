openapi: 3.0.3
info:
  title: Time Manager API
  version: "1.0.0"
  description: |
    API complète pour la gestion du temps, des équipes et des congés.

    **Base URL**: `http://localhost:3000`

    ## Authentification
    La plupart des endpoints nécessitent un token JWT dans le header `Authorization: Bearer <token>`.

    ## Rôles
    - **Employer**: Utilisateur standard
    - **Manager**: Gestionnaire d'équipe
    - **Responsable**: Administrateur avec tous les droits

servers:
  - url: http://localhost:3000
    description: Développement local

tags:
  - name: Health
    description: Vérifications basiques du serveur et de la base
  - name: Auth
    description: Authentification & jetons
  - name: Users
    description: Gestion des utilisateurs
  - name: Teams
    description: Gestion des équipes
  - name: Clocking
    description: Gestion des pointages
  - name: Leaves
    description: Gestion des congés/demandes d'absence
  - name: Warnings
    description: Gestion des avertissements

security:
  - bearerAuth: []

paths:
  # ═══════════════════════════════════════════════════════
  #  HEALTH
  # ═══════════════════════════════════════════════════════
  /ping:
    get:
      tags: [Health]
      summary: Ping du serveur
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pong:
                    type: boolean
                example: { pong: true }

  /db:
    get:
      tags: [Health]
      summary: Vérifie l'accès à la base PostgreSQL
      description: Retourne l'heure côté base (`SELECT NOW()`).
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  db_time:
                    type: string
                    format: date-time
                example:
                  db_time: "2025-10-17T13:12:00.123Z"

  # ═══════════════════════════════════════════════════════
  #  AUTH
  # ═══════════════════════════════════════════════════════
  /auth/register:
    post:
      tags: [Auth]
      summary: Créer un nouvel utilisateur
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Utilisateur créé avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email déjà utilisé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      tags: [Auth]
      summary: Se connecter et obtenir les jetons
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rafraîchir le jeton d'accès
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh]
              properties:
                refresh:
                  type: string
                  description: Refresh token
      responses:
        "200":
          description: Nouveau jeton d'accès
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags: [Auth]
      summary: Profil de l'utilisateur courant (basique)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      email:
                        type: string
                      role:
                        $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ═══════════════════════════════════════════════════════
  #  USERS
  # ═══════════════════════════════════════════════════════
  /users:
    get:
      tags: [Users]
      summary: Lister tous les utilisateurs (paginé)
      parameters:
        - in: query
          name: skip
          schema:
            type: integer
            default: 0
        - in: query
          name: take
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        "200":
          description: Liste d'utilisateurs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/info:
    get:
      tags: [Users]
      summary: Obtenir les informations complètes du user courant
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/count:
    get:
      tags: [Users]
      summary: Compter le nombre total d'utilisateurs
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/count/role/{role}:
    get:
      tags: [Users]
      summary: Compter les utilisateurs par rôle
      parameters:
        - $ref: "#/components/parameters/RoleParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/count/contract/{contractType}:
    get:
      tags: [Users]
      summary: Compter les utilisateurs par type de contrat
      parameters:
        - $ref: "#/components/parameters/ContractTypeParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/role/{role}:
    get:
      tags: [Users]
      summary: Lister les utilisateurs par rôle
      parameters:
        - $ref: "#/components/parameters/RoleParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/name/{name}:
    get:
      tags: [Users]
      summary: Rechercher des utilisateurs par nom (prénom ou nom)
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/phone/{phoneNumber}:
    get:
      tags: [Users]
      summary: Rechercher un utilisateur par numéro de téléphone
      parameters:
        - in: path
          name: phoneNumber
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/contract/{contractType}:
    get:
      tags: [Users]
      summary: Lister les utilisateurs par type de contrat
      parameters:
        - $ref: "#/components/parameters/ContractTypeParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/{id}:
    get:
      tags: [Users]
      summary: Obtenir un utilisateur par ID
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Users]
      summary: Mettre à jour un utilisateur
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Users]
      summary: Supprimer un utilisateur (soft delete)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Supprimé
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{id}/role:
    patch:
      tags: [Users]
      summary: Mettre à jour le rôle d'un utilisateur (Responsable uniquement)
      description: Nécessite des privilèges de **Responsable**. Impossible de modifier son propre rôle.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: "#/components/schemas/Role"
      responses:
        "200":
          description: Rôle mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Impossible de modifier son propre rôle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ═══════════════════════════════════════════════════════
  #  TEAMS
  # ═══════════════════════════════════════════════════════
  /teams:
    get:
      tags: [Teams]
      summary: Lister toutes les équipes (paginé)
      parameters:
        - in: query
          name: skip
          schema:
            type: integer
            default: 0
        - in: query
          name: take
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Liste des équipes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Teams]
      summary: Créer une nouvelle équipe (Manager/Responsable)
      description: Seuls les **Manager** et **Responsable** peuvent créer des équipes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamCreate"
      responses:
        "201":
          description: Équipe créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /teams/owner/{ownerId}:
    get:
      tags: [Teams]
      summary: Lister les équipes d'un propriétaire (Manager)
      parameters:
        - in: path
          name: ownerId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Liste des équipes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /teams/{id}:
    get:
      tags: [Teams]
      summary: Obtenir une équipe par ID
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Teams]
      summary: Mettre à jour une équipe (Owner ou Responsable)
      description: Seul le propriétaire (Manager) ou un Responsable peut modifier l'équipe.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamUpdate"
      responses:
        "200":
          description: Équipe mise à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Teams]
      summary: Supprimer une équipe (Owner ou Responsable)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Équipe supprimée
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ═══════════════════════════════════════════════════════
  #  CLOCKING (Pointages)
  # ═══════════════════════════════════════════════════════
  /clockings:
    post:
      tags: [Clocking]
      summary: Créer un pointage
      description: Tous les utilisateurs peuvent créer un pointage. Manager/Responsable peuvent créer pour leur équipe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClockingCreate"
      responses:
        "201":
          description: Pointage créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clocking"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    get:
      tags: [Clocking]
      summary: Lister tous les pointages (paginé, avec filtres)
      description: Responsable uniquement. Filtres disponibles par userId, date, etc.
      parameters:
        - in: query
          name: skip
          schema:
            type: integer
            default: 0
        - in: query
          name: take
          schema:
            type: integer
            default: 50
        - in: query
          name: userId
          schema:
            type: integer
        - in: query
          name: startDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Liste des pointages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Clocking"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /clockings/user/{userId}:
    get:
      tags: [Clocking]
      summary: Lister les pointages d'un utilisateur
      description: Un utilisateur peut voir ses propres pointages. Manager peut voir ceux de son équipe. Responsable peut tout voir.
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
        - in: query
          name: skip
          schema:
            type: integer
            default: 0
        - in: query
          name: take
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Liste des pointages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Clocking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /clockings/user/{userId}/stats:
    get:
      tags: [Clocking]
      summary: Obtenir les statistiques de pointage d'un utilisateur
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Statistiques calculées
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClockingStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /clockings/user/{userId}/date/{date}:
    get:
      tags: [Clocking]
      summary: Lister les pointages d'un utilisateur pour une date spécifique
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
        - in: path
          name: date
          required: true
          schema:
            type: string
            format: date
          description: Format YYYY-MM-DD
      responses:
        "200":
          description: Liste des pointages pour cette date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Clocking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /clockings/{id}:
    get:
      tags: [Clocking]
      summary: Obtenir un pointage par ID
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clocking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Clocking]
      summary: Mettre à jour un pointage
      description: |
        - **Employer** : peut uniquement modifier `lastDeparture` de ses propres pointages
        - **Manager** : peut modifier les pointages de son équipe
        - **Responsable** : peut tout modifier
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClockingUpdate"
      responses:
        "200":
          description: Pointage mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Clocking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Champs non autorisés pour Employer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Clocking]
      summary: Supprimer un pointage (Manager/Responsable)
      description: Employer ne peut pas supprimer de pointages.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Pointage supprimé
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Employer ne peut pas supprimer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # ═══════════════════════════════════════════════════════
  #  LEAVES (Congés)
  # ═══════════════════════════════════════════════════════
  /leaves:
    post:
      tags: [Leaves]
      summary: Créer une demande d'absence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveCreate"
      responses:
        "201":
          description: Demande créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leave"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

    get:
      tags: [Leaves]
      summary: Lister toutes les demandes (Responsable/Manager)
      description: Réservé aux **Responsable** et **Manager**.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Leave"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /leaves/{id}:
    get:
      tags: [Leaves]
      summary: Obtenir une demande par ID
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leave"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Leaves]
      summary: Mettre à jour une demande
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveUpdate"
      responses:
        "200":
          description: Mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leave"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Leaves]
      summary: Supprimer une demande
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Supprimé
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /leaves/{id}/status:
    patch:
      tags: [Leaves]
      summary: Changer le statut d'une demande (Manager/Responsable)
      description: Réservé aux **Responsable** et **Manager**.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: "#/components/schemas/LeaveStatus"
      responses:
        "200":
          description: Statut mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leave"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /leaves/users/{userId}:
    get:
      tags: [Leaves]
      summary: Lister les demandes d'un utilisateur
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Leave"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /leaves/teams/{teamId}:
    get:
      tags: [Leaves]
      summary: Lister les demandes d'une équipe (Manager/Responsable)
      description: Réservé aux **Responsable** et **Manager**.
      parameters:
        - in: path
          name: teamId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Leave"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

# ═══════════════════════════════════════════════════════
#  COMPONENTS
# ═══════════════════════════════════════════════════════
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      in: path
      name: id
      required: true
      schema:
        type: integer
      description: ID de la ressource

    RoleParam:
      in: path
      name: role
      required: true
      schema:
        $ref: "#/components/schemas/Role"

    ContractTypeParam:
      in: path
      name: contractType
      required: true
      schema:
        $ref: "#/components/schemas/ContractType"

  responses:
    Unauthorized:
      description: Non authentifié ou token invalide
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: "error"
            code: "UNAUTHORIZED"
            message: "Token manquant ou invalide"

    Forbidden:
      description: Accès refusé (rôle insuffisant)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: "error"
            code: "FORBIDDEN"
            message: "Accès refusé : rôle insuffisant"

    NotFound:
      description: Ressource non trouvée
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: "error"
            code: "NOT_FOUND"
            message: "Ressource introuvable"

    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: "error"
            code: "BAD_REQUEST"
            message: "Données invalides"

  schemas:
    # ─────────────────────────────────────────────────────
    #  ENUMS
    # ─────────────────────────────────────────────────────
    Role:
      type: string
      description: Rôle de l'utilisateur
      enum:
        - Employer
        - Manager
        - Responsable

    ContractType:
      type: string
      description: Type de contrat horaire
      enum:
        - H15
        - H35
        - H40

    LeaveStatus:
      type: string
      description: Statut de la demande de congé
      enum:
        - EnAttente
        - Accepte
        - Refuse

    # ─────────────────────────────────────────────────────
    #  AUTH
    # ─────────────────────────────────────────────────────
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - firstName
        - lastName
        - phoneNumber
      properties:
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        password:
          type: string
          format: password
          minLength: 8
          example: "Secret123!"
        firstName:
          type: string
          example: "John"
        lastName:
          type: string
          example: "Doe"
        phoneNumber:
          type: string
          example: "0123456789"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        password:
          type: string
          format: password
          example: "Secret123!"

    AuthResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: integer
              example: 1
            email:
              type: string
              example: "john.doe@example.com"
            role:
              $ref: "#/components/schemas/Role"
            lastName:
              type: string
              example: "Doe"
            firstName:
              type: string
              example: "John"
            phoneNumber:
              type: string
              example: "0123456789"
            contractType:
              $ref: "#/components/schemas/ContractType"
            tokens:
              type: object
              properties:
                access:
                  type: string
                  description: Access token JWT
                refresh:
                  type: string
                  description: Refresh token JWT

    # ─────────────────────────────────────────────────────
    #  USER
    # ─────────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        firstName:
          type: string
          example: "John"
        lastName:
          type: string
          example: "Doe"
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        phoneNumber:
          type: string
          example: "0123456789"
        role:
          $ref: "#/components/schemas/Role"
        contractType:
          $ref: "#/components/schemas/ContractType"
        avatarUrl:
          type: string
          nullable: true
          example: null
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - email
        - firstName
        - lastName
        - phoneNumber
        - role
        - contractType

    UserUpdate:
      type: object
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        phoneNumber:
          type: string
        contractType:
          $ref: "#/components/schemas/ContractType"

    # ─────────────────────────────────────────────────────
    #  TEAM
    # ─────────────────────────────────────────────────────
    Team:
      type: object
      properties:
        id:
          type: integer
          example: 1
        teamName:
          type: string
          example: "Équipe Dev Frontend"
        description:
          type: string
          example: "Équipe de développement frontend React"
        ownerId:
          type: integer
          example: 2
        owner:
          $ref: "#/components/schemas/User"
        members:
          type: array
          items:
            type: object
            properties:
              user:
                $ref: "#/components/schemas/User"
              joinedAt:
                type: string
                format: date-time
              isLead:
                type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - teamName
        - description
        - ownerId

    TeamCreate:
      type: object
      required:`n        - teamName`n        - ownerId
      properties:
        teamName:
          type: string
          example: "Équipe Backend"
        description:
          type: string
          example: "Équipe de développement backend"
        ownerId:
          type: integer
          description: ID du propriétaire de l'équipe (Manager/Responsable)
          example: 2
        members:
          type: array
          description: Liste optionnelle des membres à ajouter (le owner sera automatiquement ajouté comme lead)
          items:
            type: object
            required:
              - userId
            properties:
              userId:
                type: integer
                example: 3
              isLead:
                type: boolean
                default: false
                example: false
          example:
            - userId: 3
              isLead: false
            - userId: 5
              isLead: true

    TeamUpdate:
      type: object
      properties:
        teamName:
          type: string
        description:
          type: string

    # ─────────────────────────────────────────────────────
    #  CLOCKING
    # ─────────────────────────────────────────────────────
    Clocking:
      type: object
      properties:
        id:
          type: integer
          example: 1
        firstArrival:
          type: string
          format: time
          nullable: true
          example: "08:30:00"
        lastDeparture:
          type: string
          format: time
          nullable: true
          example: "17:30:00"
        workMinutes:
          type: integer
          default: 0
          example: 480
        breakMinutes:
          type: integer
          default: 0
          example: 60
        clockingDate:
          type: string
          format: date
          example: "2025-10-17"
        totalHours:
          type: number
          format: decimal
          example: 8.0
        weekDay:
          type: string
          example: "Mercredi"
        workDay:
          type: integer
          example: 3
        userId:
          type: integer
          example: 1
        user:
          $ref: "#/components/schemas/User"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - clockingDate
        - userId

    ClockingCreate:
      type: object
      required:
        - userId
        - clockingDate
      properties:
        userId:
          type: integer
          example: 1
        clockingDate:
          type: string
          format: date
          example: "2025-10-17"
        firstArrival:
          type: string
          format: time
          example: "08:30:00"
        lastDeparture:
          type: string
          format: time
          nullable: true
          example: null
        workMinutes:
          type: integer
          default: 0
        breakMinutes:
          type: integer
          default: 0

    ClockingUpdate:
      type: object
      properties:
        firstArrival:
          type: string
          format: time
        lastDeparture:
          type: string
          format: time
        workMinutes:
          type: integer
        breakMinutes:
          type: integer
      description: |
        **Employer** peut uniquement modifier `lastDeparture`.
        **Manager/Responsable** peuvent modifier tous les champs.

    ClockingStats:
      type: object
      properties:
        totalWorkMinutes:
          type: integer
          example: 9600
        totalBreakMinutes:
          type: integer
          example: 600
        averageWorkMinutes:
          type: number
          example: 480.0
        averageTotalHours:
          type: number
          example: 8.0
        totalClockings:
          type: integer
          example: 20

    # ─────────────────────────────────────────────────────
    #  LEAVE
    # ─────────────────────────────────────────────────────
    Leave:
      type: object
      properties:
        id:
          type: integer
          example: 1
        startDate:
          type: string
          format: date
          example: "2025-11-01"
        endDate:
          type: string
          format: date
          example: "2025-11-05"
        justification:
          type: string
          example: "Congés annuels"
        status:
          $ref: "#/components/schemas/LeaveStatus"
        daysLeave:
          type: integer
          example: 5
        userId:
          type: integer
          example: 1
        user:
          $ref: "#/components/schemas/User"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - startDate
        - endDate
        - justification
        - status
        - daysLeave
        - userId

    LeaveCreate:
      type: object
      required:
        - startDate
        - endDate
        - justification
        - daysLeave
      properties:
        startDate:
          type: string
          format: date
          example: "2025-11-01"
        endDate:
          type: string
          format: date
          example: "2025-11-05"
        justification:
          type: string
          example: "Congés annuels"
        daysLeave:
          type: integer
          example: 5

    LeaveUpdate:
      type: object
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        justification:
          type: string
        daysLeave:
          type: integer

