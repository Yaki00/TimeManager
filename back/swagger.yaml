      responses:
        "200":
          description: Mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leave"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Leaves]
      summary: Supprimer une demande
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Supprimé
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /leaves/{id}/status:
    patch:
      tags: [Leaves]
      summary: Changer le statut d'une demande (restreint)
      description: Réservé aux **Responsable**/**Manager**.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: "#/components/schemas/LeaveStatus"
                decidedBy:
                  type: string
                  description: ID de l'utilisateur validateur
                decisionComment:
                  type: string
      responses:
        "200":
          description: Mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leave"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /leaves/users/{userId}:
    get:
      tags: [Leaves]
      summary: Lister les demandes d'un utilisateur
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Leave"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /leaves/teams/{teamId}:
    get:
      tags: [Leaves]
      summary: Lister les demandes d'une équipe (restreint)
      description: Réservé aux **Responsable**/**Manager**.
      parameters:
        - in: path
          name: teamId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Leave"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      in: path
      name: id
      required: true
      schema:
        type: string
    RoleParam:
      in: path
      name: role
      required: true
      schema:
        $ref: "#/components/schemas/Role"
    ContractTypeParam:
      in: path
      name: contractType
      required: true
      schema:
        $ref: "#/components/schemas/ContractType"

  responses:
    Unauthorized:
      description: Non authentifié
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Accès refusé (rôle insuffisant)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Ressource non trouvée
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        phoneNumber:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        contractType:
          $ref: "#/components/schemas/ContractType"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, email, role]
    UserUpdate:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        phoneNumber:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        contractType:
          $ref: "#/components/schemas/ContractType"
    Role:
      type: string
      description: Rôle applicatif
      enum: [USER, MANAGER, RESPONSABLE, ADMIN]
    ContractType:
      type: string
      enum: [CDI, CDD, STAGE, APPRENTISSAGE, FREELANCE, AUTRE]

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        name:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/User"

    Leave:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        teamId:
          type: string
          nullable: true
        type:
          $ref: "#/components/schemas/LeaveType"
        status:
          $ref: "#/components/schemas/LeaveStatus"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        reason:
          type: string
          nullable: true
        decidedBy:
          type: string
          nullable: true
        decisionComment:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, userId, type, status, startDate, endDate]
    LeaveCreate:
      type: object
      required: [type, startDate, endDate]
      properties:
        type:
          $ref: "#/components/schemas/LeaveType"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        reason:
          type: string
          nullable: true
        teamId:
          type: string
          nullable: true
    LeaveUpdate:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/LeaveType"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        reason:
          type: string
          nullable: true
        teamId:
          type: string
          nullable: true
    LeaveType:
      type: string
      enum: [PAID, UNPAID, SICK, RTT, OTHER]
    LeaveStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]

    Team:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        ownerId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, ownerId]
    TeamCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
    TeamUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true

    Clocking:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        clockIn:
          type: string
          format: date-time
        clockOut:
          type: string
          format: date-time
          nullable: true
        breakStart:
          type: string
          format: date-time
          nullable: true
        breakEnd:
          type: string
          format: date-time
          nullable: true
        totalHours:
          type: number
          format: float
          nullable: true
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, userId, clockIn]
    ClockingCreate:
      type: object
      required: [clockIn]
      properties:
        clockIn:
          type: string
          format: date-time
        clockOut:
          type: string
          format: date-time
          nullable: true
        breakStart:
          type: string
          format: date-time
          nullable: true
        breakEnd:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
    ClockingUpdate:
      type: object
      properties:
        clockIn:
          type: string
          format: date-time
        clockOut:
          type: string
          format: date-time
          nullable: true
        breakStart:
          type: string
          format: date-time
          nullable: true
        breakEnd:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
    ClockingStats:
      type: object
      properties:
        userId:
          type: string
        totalDays:
          type: integer
        totalHours:
          type: number
          format: float
        averageHoursPerDay:
          type: number
          format: float
        period:
          type: object
          properties:
            startDate:
              type: string
              format: date
            endDate:
              type: string
              format: date

