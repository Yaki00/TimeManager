  # ═══════════════════════════════════════════════════════
  #  LEAVES (Congés)
  # ═══════════════════════════════════════════════════════
  /leaves:
    post:
      tags: [Leaves]
      summary: Créer une demande d'absence
      description: |
        Crée une nouvelle demande de congé, d'absence, de formation ou de télétravail.

        **Types de congés disponibles**:
        - **Absence**: Absence non rémunérée
        - **PaidLeave**: Congé payé
        - **Training**: Formation
        - **Remote**: Télétravail

        **Règles de validation**:
        - Les dates doivent être valides et la date de début doit précéder la date de fin
        - La période doit contenir au moins un jour ouvrable (du lundi au vendredi)
        - Un seul congé par jour (pas de chevauchement de dates)
        - Les jours de congé sont calculés automatiquement (jours ouvrés uniquement)

        **Notifications**: Une notification est automatiquement envoyée aux managers et responsables.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveCreate"
            examples:
              paidLeave:
                summary: Demande de congé payé
                value:
                  startDate: "2025-01-15"
                  endDate: "2025-01-17"
                  justification: "Congé pour raisons personnelles"
                  type: "PaidLeave"
              training:
                summary: Demande de formation
                value:
                  startDate: "2025-02-10"
                  endDate: "2025-02-11"
                  justification: "Formation React avancé"
                  type: "Training"
              remote:
                summary: Demande de télétravail
                value:
                  startDate: "2025-03-05"
                  endDate: "2025-03-05"
                  justification: "Travail à domicile"
                  type: "Remote"
      responses:
        "201":
          description: Demande créée avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leave"
              examples:
                createdLeave:
                  summary: Demande créée
                  value:
                    id: 1
                    startDate: "2025-01-15T00:00:00.000Z"
                    endDate: "2025-01-17T00:00:00.000Z"
                    justification: "Congé pour raisons personnelles"
                    status: "Pending"
                    daysLeave: 3
                    type: "PaidLeave"
                    userId: 1
                    user:
                      id: 1
                      firstName: "John"
                      lastName: "Doe"
                      email: "john.doe@example.com"
                      role: "Employer"
                      phoneNumber: "0123456789"
                      contractType: "H35"
        "400":
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidDates:
                  summary: Dates invalides
                  value:
                    status: "error"
                    code: "INVALID_DATES"
                    message: "La date de début doit précéder la date de fin"
                noBusinessDays:
                  summary: Aucun jour ouvrable
                  value:
                    status: "error"
                    code: "NO_BUSINESS_DAYS"
                    message: "La période ne contient aucun jour ouvré"
                overlap:
                  summary: Chevauchement de dates
                  value:
                    status: "error"
                    code: "OVERLAP"
                    message: "Vous avez déjà une demande de congé/absence sur cette période."
        "401":
          $ref: "#/components/responses/Unauthorized"

    get:
      tags: [Leaves]
      summary: Lister toutes les demandes (Responsable/Manager)
      description: |
        Récupère toutes les demandes de congés du système. Réservé aux rôles **Responsable** et **Manager**.

        **Fonctionnalités**:
        - Retourne toutes les demandes de tous les utilisateurs
        - Les demandes sont triées par date de création (plus récentes en premier)
        - Supporte la pagination
        - Les utilisateurs supprimés sont exclus de la liste

        **Permissions**:
        - **Employer**: Peut seulement lister ses propres demandes
        - **Manager**: Peut lister toutes les demandes de son équipe
        - **Responsable**: Peut lister toutes les demandes du système
      parameters:
        - in: query
          name: skip
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Nombre d'éléments à sauter
          example: 0
        - in: query
          name: take
          schema:
            type: integer
            default: 50
            maximum: 200
            minimum: 1
          description: Nombre d'éléments à retourner
          example: 50
      responses:
        "200":
          description: Liste des demandes de congés
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Leave"
              examples:
                listLeaves:
                  summary: Liste des demandes
                  value:
                    - id: 1
                      startDate: "2025-01-15T00:00:00.000Z"
                      endDate: "2025-01-17T00:00:00.000Z"
                      justification: "Congé pour raisons personnelles"
                      status: "Pending"
                      daysLeave: 3
                      type: "PaidLeave"
                      userId: 1
                      user:
                        id: 1
                        firstName: "John"
                        lastName: "Doe"
                        email: "john.doe@example.com"
                    - id: 2
                      startDate: "2025-02-10T00:00:00.000Z"
                      endDate: "2025-02-11T00:00:00.000Z"
                      justification: "Formation React"
                      status: "Approved"
                      daysLeave: 2
                      type: "Training"
                      userId: 2
                      user:
                        id: 2
                        firstName: "Jane"
                        lastName: "Smith"
                        email: "jane.smith@example.com"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /leaves/managers:
    get:
      tags: [Leaves]
      summary: Lister les demandes des managers (Manager ou Responsable)
      description: |
        Récupère toutes les demandes de congés des managers du système. 

        **Permissions**:
        - **Manager**: Peut voir les demandes des autres managers
        - **Responsable**: Peut voir toutes les demandes des managers

        **Différence avec `/leaves`**: Cette endpoint filtre uniquement les demandes des utilisateurs avec le rôle "Manager",
        tandis que `/leaves` retourne toutes les demandes (tous rôles confondus).

        **Cas d'usage**: Permet à un responsable ou un manager de gérer les demandes de congés des autres managers,
        de la même manière qu'ils gèrent les demandes des employés.
      parameters:
        - in: query
          name: skip
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Nombre d'éléments à sauter
          example: 0
        - in: query
          name: take
          schema:
            type: integer
            default: 50
            maximum: 200
            minimum: 1
          description: Nombre d'éléments à retourner
          example: 50
      responses:
        "200":
          description: Liste des demandes de congés des managers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Leave"
              examples:
                managerLeaves:
                  summary: Demandes des managers
                  value:
                    - id: 5
                      startDate: "2025-01-20T00:00:00.000Z"
                      endDate: "2025-01-22T00:00:00.000Z"
                      justification: "Formation management"
                      status: "Pending"
                      daysLeave: 3
