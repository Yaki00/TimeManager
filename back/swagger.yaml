  /notifications/unread/{userId}:
    get:
      tags: [Notifications]
      summary: Lister les notifications non lues d'un utilisateur (paginé)
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
        - in: query
          name: skip
          schema:
            type: integer
            default: 0
        - in: query
          name: take
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        "200":
          description: Liste des notifications non lues
          content:
            application/json:
              schema:
