            application/json:
              schema:
                $ref: "#/components/schemas/CountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /notifications/status/{status}:
    get:
      tags: [Notifications]
      summary: Lister les notifications par statut (paginé)
      parameters:
        - in: path
          name: status
          required: true
          schema:
            $ref: "#/components/schemas/NotificationStatus"
        - in: query
          name: skip
          schema:
            type: integer
            default: 0
        - in: query
          name: take
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        "200":
          description: Liste des notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /notifications/user/{userId}:
    get:
      tags: [Notifications]
      summary: Lister les notifications d'un utilisateur (paginé)
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
        - in: query
