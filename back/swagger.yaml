                        firstName: "Jane"
                        lastName: "Supervisor"
                        email: "jane.supervisor@example.com"
                        role: "Manager"
                        phoneNumber: "0787654321"
                        contractType: "H40"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

